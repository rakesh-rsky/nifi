spring.application.name=nifi-copilot
server.port=8080


# Active when the external HTTP NiFi client is selected
# mode = external | internal | auto
nifi.copilot.client.mode=auto

# Layout mode: engine (default) | disabled
nifi.copilot.layout.mode=engine

# Positive duration for per-target dynamic capability snapshots
nifi.copilot.capability.cache-ttl=PT15M