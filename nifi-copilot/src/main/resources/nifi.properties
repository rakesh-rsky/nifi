# External-mode NiFi connection defaults for Copilot
nifi.base.url=https://localhost:8443
nifi.username=admin
nifi.password=ipausedmygame
nifi.verify.ssl=false
nifi.connect.timeout.seconds=30
nifi.request.timeout.seconds=60

# Retry policy (transient GET retries and revision-conflict retries)
nifi.retry.max.attempts=3
nifi.retry.base.delay.millis=250
nifi.retry.max.delay.millis=5000

# Async request executor
nifi.async.poll.interval.millis=1000
nifi.async.timeout.seconds=120
